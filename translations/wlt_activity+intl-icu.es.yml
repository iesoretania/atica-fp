prompt.delete_confirm: |
  ¿Está seguro de que desea eliminar las siguientes actividades formativo-productivas? En el caso de que alguna de ellas tenga elementos asociados, el borrado no tendrá lugar.

  Esta operación no se puede deshacer.

prompt.copy_information: |
    Esta operación copia el programa formativo de otro proyecto de la misma enseñanza y las empresas colaboradoras del mismo.

    Para que se copie la asignación de resultados de aprendizaje y criterios es necesario que la materia asociada los tenga definidos previamente.

