export.title: Exportar empresas a Excel
export.card.title: Opciones de la exportación
export.info: |
  Se genera un libro Excel con las empresas, sus centros de trabajo y, si se indica, sus empleados, en el formato que importa nexo-fp.

  Las empresas cuyo CIF son 8 dígitos son centros educativos: se exportan con el CIF S4111001F y su código de centro en la columna correspondiente.
