form.project: Proyecto
form.student_enrollment.help: Estudiante del proyecto que realiza la formación con este convenio. Al elegirlo se recalculan empresa, centro de trabajo, programa formativo y tutor docente.
form.company.help: Empresa colaboradora con programa formativo en el proyecto. Al cambiarla se recalculan sus centros de trabajo y las actividades que ofrece.
form.workcenter.help: Centro de trabajo de la empresa donde el estudiante realiza la formación.
form.work_tutor.help: Persona de la empresa que supervisa al estudiante. Se puede buscar por su identificador o crear una nueva.
form.additional_work_tutor.help: Segunda persona de la empresa que también supervisa al estudiante. Es opcional.
form.educational_tutor.help: Docente del centro que hace el seguimiento del estudiante.
form.additional_educational_tutor.help: Segundo docente que también hace el seguimiento. Es opcional.
form.internal_code.help: Número con el que el centro identifica este convenio. Es opcional.
form.start_date.help: Primer día de la formación en la empresa.
form.end_date.help: Último día de la formación en la empresa.
form.default_start_time_1.help: Hora a la que empieza la jornada habitual, en el primer tramo del día.
form.default_end_time_1.help: Hora a la que termina el primer tramo de la jornada.
form.default_start_time_2.help: Hora a la que empieza el segundo tramo, si la jornada es partida. Es opcional.
form.default_end_time_2.help: Hora a la que termina el segundo tramo. Es opcional.
form.activity_realizations.help: Concreciones de actividad que realizará el estudiante en la empresa, agrupadas por actividad.

