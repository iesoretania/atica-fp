security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            cost: 13

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        db_provider:
            entity:
                class: App\Entity\Person

    role-hierarchy:
        ROLE_ADMIN: [ROLE_ALLOWED_TO_SWITCH]

    hide_user_not_found: true

    firewalls:
        # disables authentication for assets and the profiler, adapt it according to your needs
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern:  ^/(entrar|restablecer|publico)

        main:
            custom_authenticators:
                - App\Security\FormAuthenticator
            # a quien no ha iniciado sesión y pide una página protegida se le lleva a la pantalla de entrada
            entry_point: App\Security\FormAuthenticator

            logout:
                path: logout
                target: /

            switch_user:
                role: ROLE_ALLOWED_TO_SWITCH
                parameter: _switch_user
            lazy: true

            user_checker: App\Security\UserChecker

            # limitar los intentos de entrada fallidos (por usuario+IP y por IP)
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Solo se aplica la primera regla que coincida. Denegación por defecto: cualquier ruta nueva queda
    # protegida sin que haya que acordarse de añadir una comprobación en su controlador.
    access_control:
        # páginas públicas: entrada, cierre de sesión y restablecimiento de la contraseña
        - { path: '^/(entrar|comprobar|salir|restablecer)(/|$)', roles: PUBLIC_ACCESS }
        # la administración global es solo para administradores globales (los controladores la comprueban
        # también, esto es una segunda barrera por si a alguno se le olvida)
        - { path: '^/admin(/|$)', roles: ROLE_ADMIN }
        # el resto exige haber iniciado sesión
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
