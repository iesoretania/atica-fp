# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        name: '%session_name%'
        handler_id: null
        cookie_secure: auto
        # la cookie de sesión no debe ser accesible desde JavaScript (es el valor predeterminado, pero se deja explícito)
        cookie_httponly: true
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # Saneamiento del HTML escrito por los usuarios con el editor enriquecido (filtro Twig "sanitize_html")
    html_sanitizer:
        sanitizers:
            app.rich_text:
                allow_safe_elements: true
                allow_relative_links: true
                allow_relative_medias: true
                allowed_link_schemes: ['http', 'https', 'mailto']
                allowed_media_schemes: ['http', 'https']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
