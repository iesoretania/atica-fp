twig:
    file_name_pattern: '*.twig'
    default_path: '%kernel.project_dir%/templates'
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    form_themes:
        - 'ui/form_theme.html.twig'
    globals:
        app_name: '%env(APP_NAME)%'
        app_repository: 'https://github.com/iesoretania/atica-fp'
        app_version: '%app.version%'
        app_pub_date: '%app.pub_date%'
        app_logo: '%env(APP_LOGO)%'
        app_logo_navbar: '%env(APP_LOGO_NAVBAR)%'
        user_extension: '@App\Service\UserExtensionService'
        module_extension: '@App\Service\Module\ModuleService'
        organization_extension: '@App\Service\Organization\OrganizationBuilderChain'

when@test:
    twig:
        strict_variables: true
